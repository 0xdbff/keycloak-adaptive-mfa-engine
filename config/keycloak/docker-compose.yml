name: amfa

# Full OSS AMFA stack:
#   PostgreSQL  — shared DB server (keycloak + adaptive_mfa databases)
#   Redis       — caching and rate-limiting for the AMFA engine
#   Keycloak    — identity provider with AMFA SPI + admin-ui JAR
#   adaptive_auth — AMFA risk-evaluation engine (FastAPI)
#
# Usage:
#   cp .env.example .env   # fill in the required values
#   docker compose up --build
#
# Every realm that uses AMFA additionally needs one-time setup, or the
# Adaptive MFA admin page will fail with 403/500 (the engine rejects
# unverifiable tokens):
#   1. an `adaptive-auth-api` confidential client with service accounts
#      enabled,
#   2. an audience mapper (aud=amfa) on that client, and
#   3. the realm attribute frontendUrl=https://keycloak:8443 so tokens carry
#      an issuer the engine can trust and reach (both the engine and your
#      browser reach Keycloak at that same URL — see the `keycloak`
#      hosts-file entry in the README Prerequisites).
# See docs/keycloak-setup.md for step-by-step instructions.

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  amfa_net:
    driver: bridge

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the adaptive_mfa database on first start
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - amfa_net
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - amfa_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Mailpit (local SMTP sink) ────────────────────────────────────────────────
  # The imported test-amfa realm configures SMTP as host "mailpit", port 1025
  # (test-amfa-realm.json), so without this service Keycloak has nowhere to send
  # the email one-time code. That is not a corner case: a brand-new user has no
  # login history, so the engine returns a cautious Risk 3 on the very first
  # attempt, which requires the email step-up. Following the README from a clean
  # checkout therefore could not complete a first login.
  #
  # A sink, not a relay: it accepts everything and delivers nothing, so no mail
  # can escape a developer machine. Read the codes at http://localhost:8025
  # (tests/e2e/e2e_common.py::mailpit_latest_code reads the same API).
  mailpit:
    image: axllent/mailpit:latest
    networks:
      - amfa_net
    ports:
      - "1025:1025"   # SMTP, what Keycloak connects to
      - "8025:8025"   # web UI and API, where you read the code
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Keycloak 26 (community) ──────────────────────────────────────────────────
  # No provider JAR is vendored in this repository. This runs once before Keycloak
  # starts, fetching each one from the release or registry that publishes it and
  # verifying its digest every time. It is a no-op when a file is already present
  # and matches, and re-downloads anything missing or corrupt, so a truncated
  # download fails here rather than as a NoClassDefFoundError inside Keycloak.
  # The JARs are gitignored.
  #
  # The two DefensePoint JARs are not byte-reproducible, so these digests belong to
  # the exact published assets of the versions pinned below. Rebuilding one
  # produces different bytes.
  providers:
    image: curlimages/curl:8.11.1
    working_dir: /work
    # Point these at an internal artifact store for a mirrored or air-gapped stack.
    environment:
      SPI_BASE_URL: ${SPI_BASE_URL:-https://github.com/DefensePoint/keycloak-adaptive-mfa/releases/download}
      ADMIN_UI_BASE_URL: ${ADMIN_UI_BASE_URL:-https://github.com/DefensePoint/keycloak-adaptive-mfa-admin-ui/releases/download}
      MAVEN_BASE_URL: ${MAVEN_BASE_URL:-https://repo1.maven.org/maven2}
    volumes:
      - ./:/work
    command:
      - sh
      - -c
      - |
        set -eu
        # A JAR already on disk is never replaced. A developer who has built one
        # locally and copied it in (see README, "hot-deploy") would otherwise have
        # it silently overwritten with the released asset on the next `up`. A
        # mismatch is therefore reported and left alone, not corrected; delete the
        # file to go back to the released version.
        fetch() {
          name="$$1"; sum="$$2"; url="$$3"
          if [ -f "$$name" ]; then
            if echo "$$sum  $$name" | sha256sum -c - >/dev/null 2>&1; then
              echo "$$name present and verified"
            else
              echo "NOTE: $$name differs from the pinned release asset; leaving it as is."
              echo "      Assuming a local build. Delete it to restore the release."
            fi
            return 0
          fi
          echo "fetching $$name"
          curl -fsSL -o "$$name" "$$url"
          echo "$$sum  $$name" | sha256sum -c -
        }
        fetch keycloak-adaptive-mfa.jar \
          e02bed26dc5e65081880e4ab1dbba6fffe0dfd3b9b81db71e657e1cf497a5448 \
          "$$SPI_BASE_URL/v1.0.1/keycloak-adaptive-mfa.jar"
        fetch keycloak-admin-ui-amfa.jar \
          6d8389a503d8dc912ccb7b0ed39dba1f3f8add98eed0e2af47c350ac4de5e32a \
          "$$ADMIN_UI_BASE_URL/v1.0.1/keycloak-admin-ui-amfa.jar"
        # vavr version must match what the pinned SPI release was built against.
        fetch vavr-1.0.1.jar \
          f9ea1043ad66dbd8e0c4dd7b7a9cdce5bf2d86fab1ce33aace1ad4d56bd1270b \
          "$$MAVEN_BASE_URL/io/vavr/vavr/1.0.1/vavr-1.0.1.jar"
    networks:
      - amfa_net

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Disable hostname verification for local dev
      KC_HOSTNAME_STRICT: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/tls.key
      # NOTE: `KC_PROXY: edge` used to be set here. That is the Keycloak v1
      # spelling, REMOVED in 25+; 26.6.3 only logs "Hostname v1 options [proxy]
      # are still in use" and ignores it, so it was doing nothing. Removed rather
      # than translated, deliberately: see below.
      #
      # Deploying behind a reverse proxy, load balancer or ingress? You MUST set
      #     KC_PROXY_HEADERS: xforwarded      # or `forwarded` for RFC 7239
      # or AMFA receives the proxy's address as every user's IP. Six of the
      # nineteen risk signals then silently stop working, because every user looks
      # like the same client: geo_loc, country_name, impossible_travel,
      # geolocation_cluster_label, anonymous_detection, and the distributed-source
      # half of login_failure.
      #
      # It is left UNSET here because this compose file is the local quick-start
      # and nothing sits in front of Keycloak. Keycloak takes a forwarded address
      # on trust, so enabling it without a proxy that overwrites the header lets
      # any client choose the IP its own risk is evaluated against. With the
      # shipped test realm that is a bypass, not a nuisance: `ip_address` whitelists
      # 10.0.0.6, so `X-Forwarded-For: 10.0.0.6` would whitelist the attacker.
      #
      # To exercise the geolocation and VPN signals locally, set it temporarily and
      # relax the realm's sslRequired (Keycloak rejects plaintext HTTP once the
      # client IP is public).
      # Trust the mkcert root CA so the SPI's loopback HTTPS calls to
      # https://keycloak:8443 (service-account token fetch) pass TLS verification.
      KC_TRUSTSTORE_PATHS: /opt/keycloak/certs/rootCA.pem
      # Disable workflow feature — bug in 26.6.3 dev mode (WorkflowsEventListenerFactory NPE)
      KC_FEATURES_DISABLED: workflows
      # Dev logging: keep Keycloak at INFO but log the AMFA SPI at DEBUG.
      # Use "debug" (blanket) for full Keycloak debug output if needed.
      KC_LOG_LEVEL: "info,org.keycloak.amfa:debug"
      # Must match the engine's AMFA_WEBHOOK_AUDIENCE (see .env.example) — the
      # audience the AMFA event listener stamps onto login-event webhook JWTs.
      AMFA_WEBHOOK_AUDIENCE: ${AMFA_WEBHOOK_AUDIENCE:-amfa-webhook-event}
    volumes:
      # Test realm — auto-imported on first start (--import-realm skips if realm already exists)
      - ./test-amfa-realm.json:/opt/keycloak/data/import/test-amfa-realm.json:ro
      # AMFA SPI authenticator extension. All three JARs below are fetched by the
      # `providers` service above, not vendored in the repo.
      - ./keycloak-adaptive-mfa.jar:/opt/keycloak/providers/keycloak-adaptive-mfa.jar:ro
      # Admin-UI JAR with AMFA pages baked in — mounted OVER the built-in
      # keycloak-admin-ui jar so it replaces (not competes with) the default.
      - ./keycloak-admin-ui-amfa.jar:/opt/keycloak/providers/keycloak-admin-ui-26.6.3.jar:ro
      # vavr — functional library required by keycloak-adaptive-mfa SPI (not bundled in
      # Keycloak 26).
      - ./vavr-1.0.1.jar:/opt/keycloak/providers/vavr-1.0.1.jar:ro
      # TLS certificate (generated via mkcert — see README Troubleshooting)
      - ./certs/keycloak.pem:/opt/keycloak/certs/tls.crt:ro
      - ./certs/keycloak-key.pem:/opt/keycloak/certs/tls.key:ro
      # mkcert root CA — needed for KC_TRUSTSTORE_PATHS so Java trusts loopback HTTPS
      - ./certs/rootCA.pem:/opt/keycloak/certs/rootCA.pem:ro
    networks:
      - amfa_net
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
      # Keycloak will not start until every provider JAR is on disk and verified.
      providers:
        condition: service_completed_successfully

  # ── AMFA Engine (FastAPI) ─────────────────────────────────────────────────────
  adaptive_auth:
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "8095:80"
    env_file:
      - .env
    volumes:
      - ./certs/rootCA.pem:/opt/amfa/certs/rootCA.pem:ro
    networks:
      - amfa_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
