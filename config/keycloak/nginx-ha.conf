worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status '
                    'upstream="$upstream_addr" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # Docker's embedded DNS server. Allows nginx to re-resolve upstream
    # hostnames every 30 s so a restarted container is picked up without
    # reloading nginx.
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # ── AMFA engine — round-robin across both instances ──────────────────────
    upstream amfa_engine {
        server adaptive_auth_1:80;
        server adaptive_auth_2:80;
    }

    # ── Keycloak nodes — least_conn so a slow start-up on one node does not
    #    monopolise traffic. Sessions are replicated via Infinispan (JDBC_PING),
    #    so sticky sessions are NOT required.
    upstream keycloak_nodes {
        least_conn;
        server keycloak-1:8080;
        server keycloak-2:8080;
    }

    # ── AMFA engine (HTTP) ───────────────────────────────────────────────────
    # Exposed on host port 8095 via docker-compose port mapping (nginx:80).
    server {
        listen 80;

        location / {
            proxy_pass            http://amfa_engine;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header      X-Forwarded-Proto $scheme;
            proxy_read_timeout    30s;
            proxy_connect_timeout 10s;
        }
    }

    # ── Keycloak (HTTPS/TLS termination) ────────────────────────────────────
    # Exposed on host port 8443. nginx terminates TLS here; Keycloak nodes
    # receive plain HTTP on port 8080 with X-Forwarded-* headers. Keycloak is
    # configured with KC_PROXY_HEADERS=xforwarded so it trusts these headers
    # for token issuers and redirect URLs.
    server {
        listen 8443 ssl;
        server_name keycloak;

        ssl_certificate     /etc/nginx/certs/keycloak.pem;
        ssl_certificate_key /etc/nginx/certs/keycloak-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass              http://keycloak_nodes;
            proxy_set_header        Host              $host;
            proxy_set_header        X-Real-IP         $remote_addr;
            proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto https;
            proxy_set_header        X-Forwarded-Port  8443;
            # WebSocket support — required by the Keycloak admin UI
            proxy_http_version      1.1;
            proxy_set_header        Upgrade    $http_upgrade;
            proxy_set_header        Connection "upgrade";
            # Generous timeouts: Keycloak can be slow on cold starts and during
            # realm import. The 300 s read timeout also covers long-lived
            # server-sent event (SSE) connections from the admin UI.
            proxy_read_timeout      300s;
            # 5 s is enough to detect a dead node and retry the other one.
            # A higher value just makes failover feel slow in the browser.
            proxy_connect_timeout   5s;
            proxy_buffer_size       64k;
            proxy_buffers           8 64k;
            proxy_busy_buffers_size 128k;
        }
    }
}
