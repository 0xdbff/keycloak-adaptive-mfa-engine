name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, development]
  # Release runs this same workflow, so a tag cannot be tested differently from a PR.
  workflow_call:

jobs:
  build-and-test-matrix:
    name: build-and-test (${{ matrix.requirements }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements: [requirements.txt, requirements.lock]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amfa
          POSTGRES_PASSWORD: amfa
          POSTGRES_DB: amfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amfa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: amfa
      POSTGRES_PASSWORD: amfa
      POSTGRES_DB: amfa
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: pip install -r ${{ matrix.requirements }}
      - name: Check dependency consistency
        run: |
          pip check
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          from packaging.requirements import Requirement

          for line in Path("requirements.txt").read_text().splitlines():
              line = line.split("#", 1)[0].strip()
              if not line:
                  continue
              requirement = Requirement(line)
              if requirement.marker and not requirement.marker.evaluate():
                  continue
              installed = version(requirement.name)
              if installed not in requirement.specifier:
                  raise SystemExit(f"{requirement.name}=={installed} does not satisfy {requirement}")
          PY
      - name: Database migrations
        run: python -m alembic upgrade head
      - name: Migrations match the models
        run: python -m alembic check
      - name: Unit tests
        run: python -m pytest tests/unit -m "not slow"
      - name: Integration tests
        run: python -m pytest tests/integration

  build-and-test:
    # Without always(), a failed matrix skips this job, and a skipped required check counts as passing.
    if: always()
    needs: build-and-test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Every requirements job passed
        run: test "${{ needs.build-and-test-matrix.result }}" = success

  build-and-test-mssql:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Amfa_Test_Pass1
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Amfa_Test_Pass1 -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_TYPE: mssql
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "1433"
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: Amfa_Test_Pass1
      POSTGRES_DB: amfa
      MSSQL_ENCRYPT: "true"
      MSSQL_TRUST_SERVER_CERTIFICATE: "true"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Microsoft ODBC Driver 18
        run: |
          set -euo pipefail
          . /etc/os-release
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/prod.list" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev mssql-tools18
      - name: Create SQL Server database
        run: |
          set -euo pipefail
          export PATH="$PATH:/opt/mssql-tools18/bin"
          for _ in $(seq 1 30); do
            sqlcmd -S localhost,1433 -U sa -P 'Amfa_Test_Pass1' -C -Q "SELECT 1" && break
            sleep 2
          done
          sqlcmd -S localhost,1433 -U sa -P 'Amfa_Test_Pass1' -C -Q \
            "CREATE DATABASE amfa COLLATE Latin1_General_100_CS_AS_SC_UTF8; CREATE DATABASE amfa_default_collation"
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: aioodbc dialect is importable
        run: python -c "from sqlalchemy.dialects.mssql import aioodbc; assert aioodbc.dialect.driver == 'aioodbc'"
      - name: Database migrations
        run: python -m alembic upgrade head
      - name: Migrations match the models
        run: python -m alembic check
      - name: Unit tests
        run: python -m pytest tests/unit -m "not slow"
      - name: Integration tests
        run: python -m pytest tests/integration
      # Azure SQL's default collation is case-insensitive. Tenant isolation must
      # hold even when a database was not created with the recommended one.
      - name: Integration tests on the server's default collation
        env:
          POSTGRES_DB: amfa_default_collation
        run: |
          python -m alembic upgrade head
          python -m pytest tests/integration
