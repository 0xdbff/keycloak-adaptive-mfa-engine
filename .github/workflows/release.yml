name: Release

# Pushing a tag like v1.0.1 runs the unit tests, builds the engine image
# from that tag, pushes it to GHCR, and publishes a GitHub Release whose
# notes carry the pull command and the image digest. The engine's
# deliverable is the image; the SPI and admin-ui JARs are released from
# their own repositories.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push the image to GHCR

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DIGEST="${{ steps.build.outputs.digest }}"
          NOTES="$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            "Engine image for this release:" \
            '```' \
            "docker pull ${IMAGE}:${GITHUB_REF_NAME#v}" \
            '```' \
            "Digest: \`${DIGEST}\` (pin with \`${IMAGE}@${DIGEST}\` for reproducible deployments).")"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "$NOTES"
